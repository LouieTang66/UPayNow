name: Bug 或使用问题
description: 报告可复现的问题；安全漏洞请私下联系。
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: |
        先阅读商户操作手册及安全说明。不要填写密码、恢复密钥、API/通知密钥、Cookie、钱包私钥/助记词、带 token 的 RPC URL、手机二维码或完整入口链接。
        安全漏洞请私下联系 hi@louie66.com 或 Telegram @Louie_66，不要公开利用步骤。
  - type: input
    id: version
    attributes:
      label: 版本或提交标识
      description: 填写实际使用版本，不要只写“最新版”。
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: 运行环境与相关页面
      description: 系统、Node 版本、浏览器/钱包类型、安装方式及涉及页面；涉及链时补充网络与 Chain ID。不要上传实例配置文件。
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: 最小复现步骤
      description: 按实际点击或请求顺序描述；说明发生前是否已有待确认钱包请求或 UNKNOWN 任务。
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: 预期结果与实际结果
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: 脱敏错误、日志或截图
      description: 如有必要提供公开交易哈希和部署 ID。先遮蔽敏感信息，二维码也须遮蔽；不要粘贴完整数据库、备份或浏览器存储。
  - type: checkboxes
    id: privacy
    attributes:
      label: 隐私检查
      options:
        - label: 我已检查，没有提交凭据、钱包秘密、敏感配置或有效手机入口。
          required: true
